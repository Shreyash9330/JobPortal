name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run tests
        run: ./mvnw -B test
        env:
          JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
          DB_PASSWORD: unused

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/jobportal-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/jobportal-frontend/package-lock.json
      - run: npm install
      - run: npm run build
