server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000


# Password reset email (Brevo HTTP API; leave BREVO_API_KEY empty to log the OTP instead)
app.mail.from=${MAIL_FROM:no-reply@jobportal.local}
app.mail.brevo-api-key=${BREVO_API_KEY:}
